<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic Analog Clock</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-serif">

  <!-- Clock Outer Frame -->
  <div class="relative w-80 h-80 bg-stone-200 rounded-full p-4 shadow-2xl border-4 border-stone-300 flex items-center justify-center">
    
    <!-- Clock Face -->
    <div class="relative w-full h-full bg-amber-50 rounded-full border-2 border-stone-400 shadow-inner flex items-center justify-center">
      
      <!-- Hour Markings (1 to 12) -->
      <div class="absolute top-3 font-bold text-stone-800 text-lg">12</div>
      <div class="absolute right-4 font-bold text-stone-800 text-lg">3</div>
      <div class="absolute bottom-3 font-bold text-stone-800 text-lg">6</div>
      <div class="absolute left-4 font-bold text-stone-800 text-lg">9</div>

      <div class="absolute top-7 right-16 font-bold text-stone-700 text-sm">1</div>
      <div class="absolute top-16 right-7 font-bold text-stone-700 text-sm">2</div>
      <div class="absolute bottom-16 right-7 font-bold text-stone-700 text-sm">4</div>
      <div class="absolute bottom-7 right-16 font-bold text-stone-700 text-sm">5</div>

      <div class="absolute bottom-7 left-16 font-bold text-stone-700 text-sm">7</div>
      <div class="absolute bottom-16 left-7 font-bold text-stone-700 text-sm">8</div>
      <div class="absolute top-16 left-7 font-bold text-stone-700 text-sm">10</div>
      <div class="absolute top-7 left-16 font-bold text-stone-700 text-sm">11</div>

      <!-- Center Pin -->
      <div class="absolute w-4 h-4 bg-stone-900 rounded-full z-40 border-2 border-amber-50 shadow"></div>

      <!-- Hour Hand -->
      <div id="hour-hand" class="absolute bottom-1/2 w-2 h-20 bg-stone-900 rounded-t-full origin-bottom z-10 transition-transform ease-linear duration-75"></div>

      <!-- Minute Hand -->
      <div id="minute-hand" class="absolute bottom-1/2 w-1.5 h-28 bg-stone-800 rounded-t-full origin-bottom z-20 transition-transform ease-linear duration-75"></div>

      <!-- Second Hand -->
      <div id="second-hand" class="absolute bottom-1/2 w-0.5 h-32 bg-amber-700 rounded-t-full origin-bottom z-30 transition-transform ease-linear duration-75"></div>
      
    </div>
  </div>

  <script>
    const hourHand = document.getElementById('hour-hand');
    const minuteHand = document.getElementById('minute-hand');
    const secondHand = document.getElementById('second-hand');

    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      // Degree Calculations
      const secondDeg = (seconds / 60) * 360;
      const minuteDeg = ((minutes + seconds / 60) / 60) * 360;
      const hourDeg = (((hours % 12) + minutes / 60) / 12) * 360;

      // Apply rotations
      secondHand.style.transform = `rotate(${secondDeg}deg)`;
      minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
      hourHand.style.transform = `rotate(${hourDeg}deg)`;
    }

    // Run clock updates every second
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
